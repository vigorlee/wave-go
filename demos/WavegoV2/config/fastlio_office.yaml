common:
  lid_topic: /office/fastlio_input
  lid_frame_id: lidar
  imu_topic: /imu/data_raw
  time_sync_en: false
  time_offset_lidar_to_imu: 0.0
preprocess:
  lidar_type: 3
  scan_line: 6
  scan_rate: 10
  timestamp_unit: 3
  blind: 0.5
mapping:
  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  fov_degree: 360.0
  det_range: 35.0
  extrinsic_est_en: false
  extrinsic_T: [0.15568, -0.02329, 0.13366]
  extrinsic_R: [1,0,0,0,1,0,0,0,1]
publish:
  path_en: true
  scan_publish_en: true
  dense_publish_en: true
  scan_bodyframe_pub_en: true
pcd_save:
  pcd_save_en: false
  interval: -1
feature_extract_enable: false
point_filter_num: 1
max_iteration: 3
filter_size_surf: 0.10
filter_size_map: 0.10
cube_side_length: 1000.0
runtime_pos_log_enable: false
